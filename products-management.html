<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>Products Management</title>
</head>
<body>
  
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
         <div class="sidebar">
                <div class="sidebar-header text-center">
                    <h4>Resturant Management System</h4>
                    <div class="user-info mt-3 d-flex flex-column align-items-center">
                        <img src="./Images/Michael Chen.webp" alt="صورة المستخدم" class="user-img mb-2" style="width: 80px; height: 80px; border-radius: 50%;">
                        <h6 class="user-name mb-1" id="userName">Omar Elseofy</h6>
                        <p class="user-role" id="userRole">Admin</p>
                    </div>
                 </div>

                <nav>
                  
                    <a href="admin.html" class="menu-item active">
                        <i class="fas fa-user-graduate"></i>
                        User Mangement
                    </a>
                    <a href="products-management.html" class="menu-item">
                        <i class="fas fa-book"></i>
                        Products Mangement
                    </a>
                    <a href="Order_management.html" class="menu-item">
                        <i class="fas fa-user-plus"></i>
                        Order Mangement
                    </a>
                 <button class="btn btn-danger w-100 mt-3" onclick="window.location.href='login_Register.html'">
                      <i class="fas fa-sign-out-alt me-2"></i> Log out
                </button>


                </nav>
            </div>

    </div>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Products Management</h2>
        <button class="btn btn-success" id="addProductBtn">Add Product</button>
    </div>

    <!-- Search -->
    <input type="text" class="form-control mb-3" placeholder="Search products..." id="searchProduct">

    <!-- Products Table -->
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Toppings</th>
                <th>Price (EGP)</th>
                <th>Image</th>
                <th class="actions-cell">Actions</th>
            </tr>
        </thead>
        <tbody id="productsTableBody">
            <!-- Products load here -->
        </tbody>
    </table>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            
            <div class="modal-header">
                <h5 class="modal-title">Add/Edit Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">

                    <div class="mb-3">
                        <label>Product Name</label>
                        <input type="text" id="productNameInput" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Toppings</label>
                        <input type="text" id="productToppingsInput" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label>Price (EGP)</label>
                        <input type="number" id="productPriceInput" class="form-control" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label>Image URL</label>
                        <input type="text" id="productImageInput" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirm Deletion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete this product?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="confirmDeleteBtn" type="button" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>
</div>
<!-- Modal -->
<div class="modal fade" id="productDetailsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Product Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="productDetailsForm">
          <div class="mb-3">
            <label class="form-label">Long Description</label>
            <textarea id="productLongDesc" class="form-control"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Additional Images (comma separated URLs)</label>
            <input type="text" id="productImages" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Features (comma separated)</label>
            <input type="text" id="productFeatures" class="form-control">
          </div>
          <button type="button" class="btn btn-primary" onclick="saveProductDetails()">Save Details</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="./js/products-management.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
